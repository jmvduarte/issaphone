# Compila o IssaFone para Android e gera os .apk.
#  - Sempre: APK de debug (instala-se diretamente no telemóvel).
#  - Se existirem os Secrets da keystore: APK de release assinado.
#  - Ao criar uma tag vX.Y (ex.: v1.0): publica o APK numa Release do GitHub.

name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar a Release nas tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do gradlew
        run: chmod +x gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Preparar keystore (se configurada)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/issafone.jks"
            echo "path=$RUNNER_TEMP/issafone.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK de release assinado
        if: steps.keystore.outputs.path != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Juntar APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/IssaFone-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/IssaFone.apk
          fi
          ls -la out

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: IssaFone-apk
          path: android/out/*.apk
          retention-days: 14

      - name: Criar Release (tags vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
