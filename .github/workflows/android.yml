# Compila o IssaFone para Android e gera os .apk.
#  - Com os Secrets da keystore (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#    ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD): APKs de release assinados com a chave
#    privada → IssaFone.apk e IssaLink.apk (o Play Protect desconfia menos destes).
#  - Sem eles: APKs de debug (chave de teste pública).
#  - Cada build do main (e cada tag vX.Y) publica o APK numa Release do GitHub.

name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar as Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Token para publicar no repositório jmvduarte/issalink (Settings → Secrets → ISSALINK_TOKEN)
      ISSALINK_TOKEN: ${{ secrets.ISSALINK_TOKEN }}
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do gradlew
        run: chmod +x gradlew

      - name: Compilar APK de debug
        run: |
          FALHOU=0
          ./gradlew assembleIssafoneDebug assembleIssalinkDebug > gradle.log 2>&1 || FALHOU=1
          # Erros de compilação como anotações (visíveis no resumo da execução)
          grep -E "^e: |error:|What went wrong" -A2 gradle.log | grep -vE "^--$" \
            | awk 'length > 0 && !visto[$0]++' | head -40 \
            | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          tail -20 gradle.log
          exit $FALHOU

      - name: Preparar keystore (se configurada)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/issafone.jks"
            echo "path=$RUNNER_TEMP/issafone.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK de release assinado
        if: steps.keystore.outputs.path != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleIssafoneRelease assembleIssalinkRelease --stacktrace

      - name: Juntar APKs
        run: |
          mkdir -p out out-issalink
          R=app/build/outputs/apk
          # release (chave privada) se existir; senão debug
          if [ -f $R/issafone/release/app-issafone-universal-release.apk ]; then T=release; F=IssaFone.apk
          else T=debug; F=IssaFone-debug.apk; fi
          # Universal (para instalar à mão) + um por processador (para as atualizações automáticas)
          cp $R/issafone/$T/app-issafone-universal-$T.apk out/$F
          cp $R/issalink/$T/app-issalink-universal-$T.apk out-issalink/IssaLink.apk
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp $R/issafone/$T/app-issafone-$abi-$T.apk out/${F%.apk}-$abi.apk
            cp $R/issalink/$T/app-issalink-$abi-$T.apk out-issalink/IssaLink-$abi.apk
          done
          ls -la out out-issalink

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: IssaFone-apk
          path: android/out/*.apk
          retention-days: 14

      # IssaLink: publicado no seu próprio repositório (jmvduarte/issalink), Release "android-N".
      - name: Publicar IssaLink no repositório issalink
        if: github.ref == 'refs/heads/main' && env.ISSALINK_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: jmvduarte/issalink
          token: ${{ secrets.ISSALINK_TOKEN }}
          tag_name: ${{ format('android-{0}', github.run_number) }}
          name: ${{ format('IssaLink para Android 1.0.{0}', github.run_number) }}
          make_latest: true
          body: |
            **IssaLink para Android** — chamadas SIP (voz e vídeo) e chat para qualquer central **Issabel 4**.

            - Telemóveis atuais: **IssaLink-arm64-v8a.apk** · se não instalar: **IssaLink.apk** (universal).
            - Entra com o endereço do servidor, a extensão e a palavra-passe. Sem preparar o servidor funcionam só as chamadas (UDP, como o Zoiper); com o [guia](https://github.com/jmvduarte/issalink/blob/main/GUIA-SERVIDOR.md) tens chamadas cifradas, chat, anexos e a webapp.
          files: android/out-issalink/*.apk

      # Transição: as apps IssaLink antigas procuram atualizações aqui (issalink-N).
      # Esta Release leva-as para a versão que já procura no repositório issalink.
      - name: Publicar Release do IssaLink (transição)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('issalink-{0}', github.run_number) }}
          name: ${{ format('IssaLink Android (build {0}) — mudou para jmvduarte/issalink', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            O IssaLink passou a ter repositório próprio: **https://github.com/jmvduarte/issalink**
            Instala esta versão; as seguintes chegam de lá.
          files: android/out-issalink/*.apk

      # Cada build do main fica numa Release própria (android-N). O link
      # https://github.com/<utilizador>/<repo>/releases/latest dá sempre o APK mais recente.
      - name: Publicar Release com o APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('android-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('IssaFone Android (build {0})', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK do IssaFone gerado automaticamente a partir do commit ${{ github.sha }}.

            Instala o **IssaFone.apk** no telemóvel (autoriza "instalar apps de origem desconhecida").
          files: android/out/*.apk
