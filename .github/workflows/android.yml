# Compila o IssaFone para Android e gera os .apk.
#  - Com os Secrets da keystore (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#    ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD): APKs de release assinados com a chave
#    privada → IssaFone.apk e IssaLink.apk (o Play Protect desconfia menos destes).
#  - Sem eles: APKs de debug (chave de teste pública), como antes.
#  - Cada build do main (e cada tag vX.Y) publica o APK numa Release do GitHub.

name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar as Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do gradlew
        run: chmod +x gradlew

      - name: Compilar APK de debug
        run: |
          FALHOU=0
          ./gradlew assembleIssafoneDebug assembleIssalinkDebug > gradle.log 2>&1 || FALHOU=1
          # Erros de compilação como anotações (visíveis no resumo da execução)
          grep -E "^e: |error:|What went wrong" -A2 gradle.log | grep -vE "^--$" \
            | awk 'length > 0 && !visto[$0]++' | head -40 \
            | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          tail -20 gradle.log
          exit $FALHOU

      - name: Preparar keystore (se configurada)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/issafone.jks"
            echo "path=$RUNNER_TEMP/issafone.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK de release assinado
        if: steps.keystore.outputs.path != ''
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleIssafoneRelease assembleIssalinkRelease --stacktrace

      - name: Juntar APKs
        run: |
          mkdir -p out out-issalink
          R=app/build/outputs/apk
          if [ -f $R/issafone/release/app-issafone-release.apk ]; then
            # Versão final, assinada com a chave privada
            cp $R/issafone/release/app-issafone-release.apk out/IssaFone.apk
            cp $R/issalink/release/app-issalink-release.apk out-issalink/IssaLink.apk
          else
            cp $R/issafone/debug/app-issafone-debug.apk out/IssaFone-debug.apk
            cp $R/issalink/debug/app-issalink-debug.apk out-issalink/IssaLink.apk
          fi
          ls -la out out-issalink

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: IssaFone-apk
          path: android/out/*.apk
          retention-days: 14

      # Cada build do main fica numa Release própria (android-N). O link
      # https://github.com/<utilizador>/<repo>/releases/latest dá sempre o APK mais recente.
      - name: Publicar Release com o APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('android-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('IssaFone Android (build {0})', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK do IssaFone gerado automaticamente a partir do commit ${{ github.sha }}.

            Instala o **IssaFone.apk** no telemóvel (autoriza "instalar apps de origem desconhecida").
          files: android/out/*.apk

      # IssaLink: a mesma app sem os dados do Issabel do projeto, para qualquer pessoa usar
      # na sua central. Release "issalink-N" (não fica como "latest", que é a do IssaFone).
      - name: Publicar Release do IssaLink
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('issalink-{0}', github.run_number) }}
          name: ${{ format('IssaLink Android (build {0})', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            **IssaLink** — softphone (chamadas SIP, vídeo e chat XMPP) para qualquer central **Issabel 4**.

            1. Prepara o servidor com o script `servidor/configurar-issabel.sh` deste repositório (instruções no README).
            2. Instala o **IssaLink.apk** no Android e entra com o endereço do servidor, a extensão e a palavra-passe.
          files: android/out-issalink/IssaLink.apk
