# Desenha os ecrãs da app Android com dados de exemplo (Paparazzi, sem emulador)
# e publica as imagens no ramo "capturas", para rever o visual antes de lançar uma versão.

name: Capturas de ecrã

on:
  push:
    branches: [main, redesenho]
    paths: ['android/**', '.github/workflows/capturas.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Gerar capturas
        run: |
          FALHOU=0
          ./gradlew recordPaparazziDebug > gradle.log 2>&1 || FALHOU=1
          grep -E "^e: |error:|What went wrong|FAILED|Exception" -A2 gradle.log | grep -vE "^--$" \
            | awk 'length > 0 && !visto[$0]++' | head -40 \
            | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          tail -25 gradle.log
          exit $FALHOU

      - name: Publicar no ramo "capturas"
        run: |
          mkdir -p "$RUNNER_TEMP/c"
          cp app/src/test/snapshots/images/*.png "$RUNNER_TEMP/c/"
          cd "$RUNNER_TEMP/c"
          git init -q && git checkout -q -b capturas
          git add . && git -c user.name="IssaFone CI" -c user.email="ci@issafone" commit -qm "Capturas de ${GITHUB_SHA::8} (${GITHUB_REF_NAME})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
          echo "::notice::$(ls | wc -l) capturas publicadas no ramo capturas"
