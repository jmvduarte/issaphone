name: Sonda SDK Linphone
on: workflow_dispatch
jobs:
  sonda:
    runs-on: macos-15
    steps:
      - run: |
          set +e
          curl -sSfL -o sdk.zip https://download.linphone.org/releases/ios/linphone-sdk-ios-5.3.5.zip
          unzip -q sdk.zip -d sdk
          X=sdk/linphone-sdk/apple-darwin/XCFrameworks
          echo "::notice::xcf $(ls $X | tr '\n' ' ')"
          ls sdk/linphone-sdk/apple-darwin | tr '\n' ' ' | sed 's/^/::notice::raiz /'; echo
          find sdk -name "*.swift" -not -path "*/Headers/*" | head -10 | while read -r f; do echo "::notice::swift $f ($(wc -l < "$f") linhas)"; done
          find sdk -name "*.swiftinterface" | head -5 | while read -r f; do echo "::notice::swiftinterface $f"; done
          find sdk -name "Info.plist" -path "*linphonesw*" -maxdepth 6 | head -3 | while read -r f; do echo "::notice::plist $f"; done
          ls $X/linphonesw.xcframework 2>/dev/null | tr '\n' ' ' | sed 's/^/::notice::linphonesw.xcf /'; echo
          ls -d $X/*/ios-arm64*/ 2>/dev/null | head -3 | sed 's/^/::notice::slice /'
          true
