# Mantém o repositório público do IssaLink (jmvduarte/issalink) atualizado a partir deste:
#   - ramo main:     README, guia do servidor e scripts do servidor
#   - ramo gh-pages: webapp IssaLink (https://jmvduarte.github.io/issalink/)
# As Releases (APK e instaladores) são publicadas lá pelos workflows Android e desktop.
# Requer o secret ISSALINK_TOKEN (token com Contents e Pages: Read and write no issalink).
name: Repositório IssaLink

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'servidor/**'
      - 'GUIA-SERVIDOR.md'
      - 'issalink/**'
      - '.github/workflows/issalink.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.ISSALINK_TOKEN }}
      DESTINO: jmvduarte/issalink
    steps:
      - name: Falta o token
        if: env.TOKEN == ''
        run: echo "::warning::Falta o secret ISSALINK_TOKEN; o repositório issalink não foi atualizado."

      - uses: actions/checkout@v4
        if: env.TOKEN != ''

      - name: Preparar conteúdo
        if: env.TOKEN != ''
        run: |
          mkdir -p out/main out/pages
          # main: README próprio, guia com os links do repositório issalink, scripts do servidor
          cp issalink/README.md out/main/README.md
          cp -a servidor out/main/servidor
          sed -e 's#github.com/jmvduarte/issaphone/releases#github.com/jmvduarte/issalink/releases#g' \
              -e 's#raw.githubusercontent.com/jmvduarte/issaphone/main/servidor#raw.githubusercontent.com/jmvduarte/issalink/main/servidor#g' \
              -e 's#jmvduarte.github.io/issaphone/issalink/#jmvduarte.github.io/issalink/#g' \
              -e 's#procura a mais recente \*\*issalink-N\*\* e descarrega#abre a versão mais recente e descarrega#' \
              GUIA-SERVIDOR.md > out/main/GUIA-SERVIDOR.md
          # gh-pages: webapp com a marca IssaLink, a pedir o servidor
          cp -a web/. out/pages/
          sh web/marcar.sh out/pages IssaLink true
          rm -f out/pages/marcar.sh
          sed -i "s/const VERSAO = '.*';/const VERSAO = 'issalink-${GITHUB_SHA::8}';/" out/pages/sw.js
          touch out/pages/.nojekyll

      - name: Publicar no repositório issalink
        if: env.TOKEN != ''
        run: |
          git config --global user.name "IssaLink (automático)"
          git config --global user.email "issafone@users.noreply.github.com"
          URL="https://x-access-token:${TOKEN}@github.com/${DESTINO}.git"
          publicar() {  # $1 = pasta com o conteúdo, $2 = ramo
            rm -rf repo
            if git clone -q --depth 1 -b "$2" "$URL" repo 2>/dev/null; then :; else
              git init -q -b "$2" repo && git -C repo remote add origin "$URL"
            fi
            find repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$1"/. repo/
            git -C repo add -A
            if git -C repo diff --cached --quiet; then echo "$2: sem alterações"; return; fi
            git -C repo commit -qm "Atualizado a partir de jmvduarte/issaphone@${GITHUB_SHA::8}"
            git -C repo push -q origin "$2"
            echo "$2: publicado"
          }
          publicar out/main main
          publicar out/pages gh-pages

      - name: Ativar o GitHub Pages (primeira vez)
        if: env.TOKEN != ''
        run: |
          codigo=$(curl -s -o resposta.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${DESTINO}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          case "$codigo" in
            201) echo "::notice::GitHub Pages ativado: https://jmvduarte.github.io/issalink/" ;;
            409) echo "GitHub Pages já estava ativo" ;;
            *)   echo "::warning::Não consegui ativar o GitHub Pages ($codigo). Ativa à mão: issalink → Settings → Pages → Deploy from a branch → gh-pages / (root)."; cat resposta.json ;;
          esac
