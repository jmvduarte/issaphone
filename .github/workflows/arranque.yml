# Diagnóstico: instala o APK de uma Release num emulador, abre a app e mostra o crash (se houver).
name: Teste de arranque
on:
  push:
    branches: [teste-arranque]
jobs:
  arranque:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Descarregar APK
        run: curl -fsSL -o app.apk https://github.com/jmvduarte/issaphone/releases/download/android-40/IssaFone.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p pt.ipca.issafone -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof pt.ipca.issafone && echo "::notice::app a correr" || echo "::error::app nao esta a correr"
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d | grep -E "AndroidRuntime|FATAL|pt.ipca.issafone" | tail -60 > log.txt || true
            sed 's/%/%25/g' crash.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "FATAL|Exception|Caused by|at pt\.ipca" log.txt | head -30 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::warning::$l"; done
