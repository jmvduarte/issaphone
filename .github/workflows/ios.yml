# Compila o IssaFone para iPhone num Mac do GitHub e gera um .ipa SEM assinatura.
# O .ipa depois é assinado e instalado no iPhone a partir do Windows com o Sideloadly
# (usa o teu Apple ID gratuito). Ver README, secção "Compilar no GitHub".

name: iOS build

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:   # permite correr à mão no separador Actions

permissions:
  contents: write   # para publicar o .ipa numa Release (link fixo para descarregar)

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Escolher Xcode mais recente
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Cache do SDK Linphone
        uses: actions/cache@v4
        with:
          path: ios/LinphoneSDK
          key: linphone-ios-${{ hashFiles('ios/scripts/obter-linphone.sh') }}

      - name: Obter SDK Linphone (download.linphone.org)
        run: bash scripts/obter-linphone.sh

      - name: Gerar projeto Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache dos pacotes Swift
        uses: actions/cache@v4
        with:
          path: ios/build/SourcePackages
          key: spm-${{ hashFiles('ios/project.yml') }}

      - name: Compilar (sem assinatura)
        run: |
          FALHOU=0
          xcodebuild \
            -project IssaFone.xcodeproj \
            -scheme IssaFone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || FALHOU=1

          # Publica os erros como anotações (aparecem no resumo da execução)
          grep -E -A4 "error:|Could not resolve|fatal:" xcodebuild.log \
            | grep -vE "^--$" | sed 's/^[[:space:]]*//' | awk 'length > 0' \
            | awk '!visto[$0]++' | head -40 \
            | while IFS= read -r linha; do echo "::error::${linha//%/%25}"; done
          tail -30 xcodebuild.log

          [ "$FALHOU" = 0 ] && test -d build/Build/Products/Release-iphoneos/IssaFone.app

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IssaFone.app Payload/
          zip -qry IssaFone-unsigned.ipa Payload
          echo "::notice::Frameworks incluídas: $(ls Payload/IssaFone.app/Frameworks | tr '\n' ' ')"
          echo "::notice::Ícones no .app: $(ls Payload/IssaFone.app | grep -i appicon | tr '\n' ' ')"
          echo "::notice::Tamanho do .ipa: $(du -h IssaFone-unsigned.ipa | cut -f1)"

      - name: Publicar .ipa
        uses: actions/upload-artifact@v4
        with:
          name: IssaFone-ipa
          path: ios/IssaFone-unsigned.ipa
          retention-days: 14

      - name: Publicar na Release "ios" (link fixo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pré-lançamento: não aparece como "latest", para não baralhar as atualizações do Android
          gh release view ios >/dev/null 2>&1 || gh release create ios --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "IssaFone iOS (sem assinatura)" \
            --notes "Instalar com o Sideloadly (Windows/Mac) e um Apple ID gratuito. Ver README."
          gh release upload ios IssaFone-unsigned.ipa --clobber
          echo "::notice::https://github.com/${GITHUB_REPOSITORY}/releases/download/ios/IssaFone-unsigned.ipa"

      - name: Publicar log em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
