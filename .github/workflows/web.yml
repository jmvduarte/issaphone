# Publica a webapp (pasta web/) no GitHub Pages:
#   https://<utilizador>.github.io/<repositório>/
# Requer, uma vez: Settings → Pages → Source: "GitHub Actions".

name: Webapp (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cada publicação muda a versão da cache do service worker,
      # para os browsers irem buscar os ficheiros novos.
      - name: Versão da cache
        run: sed -i "s/const VERSAO = '.*';/const VERSAO = 'issafone-${GITHUB_SHA::8}';/" web/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
