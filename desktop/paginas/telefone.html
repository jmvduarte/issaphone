<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'">
<title>Telefone</title>
<style>
  :root { --fundo:#0d1117; --cartao:#161b22; --linha:#30363d; --texto:#e6edf3; --suave:#9aa4b2;
          --verde:#22c55e; --vermelho:#ef4444; --azul:#2F5BFF; --ciano:#14C8B4; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:15px/1.4 system-ui, "Segoe UI", Ubuntu, sans-serif;
         display:flex; flex-direction:column; user-select:none; }
  header { background:linear-gradient(135deg,var(--azul),var(--ciano)); padding:14px 18px 18px; border-radius:0 0 24px 24px; }
  .topo { display:flex; align-items:center; gap:12px; }
  .topo img { width:40px; height:40px; border-radius:12px; }
  .topo h1 { margin:0; font-size:20px; flex:1; color:#fff; }
  .pilula { display:inline-flex; align-items:center; gap:7px; margin-top:10px; padding:6px 12px; border-radius:999px;
            background:rgba(0,0,0,.22); color:#fff; font-size:13px; max-width:100%; }
  .pilula i { width:9px; height:9px; border-radius:50%; background:#facc15; flex:none; }
  .pilula.ok i { background:var(--verde); } .pilula.erro i { background:var(--vermelho); }
  .pilula span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  .ligeiro { color:#fff; opacity:.9; padding:6px 10px; border-radius:10px; }
  .ligeiro:hover { background:rgba(0,0,0,.18); }
  main { flex:1; display:flex; gap:22px; padding:22px; min-height:0; }
  .teclado { width:min(340px,100%); margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:14px; }
  #numero { width:100%; text-align:center; font-size:30px; letter-spacing:1px; background:none; border:0; color:var(--texto);
            border-bottom:1px solid var(--linha); padding:8px 4px; outline:none; user-select:text; }
  .grelha { display:grid; grid-template-columns:repeat(3, 76px); gap:14px; }
  .tecla { width:76px; height:76px; border-radius:50%; background:var(--cartao); font-size:26px; display:flex; flex-direction:column;
           align-items:center; justify-content:center; transition:background .15s; }
  .tecla small { font-size:10px; color:var(--suave); letter-spacing:2px; height:12px; }
  .tecla:hover { background:#1f2630; } .tecla:active { background:#2a3340; }
  .acoes { display:flex; align-items:center; gap:26px; margin-top:4px; }
  .redondo { width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .verde { background:var(--verde); } .vermelho { background:var(--vermelho); }
  .redondo svg { width:30px; height:30px; fill:#fff; }
  #apagar { color:var(--suave); font-size:22px; width:48px; height:48px; border-radius:50%; }
  #apagar:hover { background:var(--cartao); }
  aside { width:300px; background:var(--cartao); border-radius:20px; padding:14px; overflow:auto; }
  aside h2 { margin:4px 6px 10px; font-size:16px; }
  .recente { display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:12px; cursor:pointer; }
  .recente:hover { background:#1f2630; }
  .avatar { width:38px; height:38px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
            font-weight:700; color:#fff; background:linear-gradient(135deg,var(--azul),var(--ciano)); }
  .recente .info { flex:1; min-width:0; } .recente .info b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recente .info span { color:var(--suave); font-size:12px; }
  .seta { font-size:14px; } .perdida { color:var(--vermelho); }
  .vazio { color:var(--suave); text-align:center; margin-top:30px; }
  @media (max-width:760px) { aside { display:none; } }
  /* Ecrã de chamada (feita, recebida, em curso) */
  #chamada { position:fixed; inset:0; background:radial-gradient(circle at 50% 20%, #1d2b55, var(--fundo) 65%);
             display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #chamada[hidden] { display:none; }
  #chamada .avatar { width:110px; height:110px; font-size:40px; margin-bottom:8px; }
  #chamada h2 { margin:0; font-size:28px; } #chamada .num { color:var(--suave); }
  #estadoChamada { color:#cbd5e1; min-height:1.4em; }
  .botoes { display:flex; flex-wrap:wrap; justify-content:center; gap:18px; margin:26px 0 10px; max-width:420px; }
  .opcao { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; color:#cbd5e1; }
  .opcao .redondo { width:60px; height:60px; background:rgba(255,255,255,.1); }
  .opcao.ativo .redondo { background:#fff; } .opcao.ativo svg { fill:#0d1117; }
  .opcao svg { width:26px; height:26px; fill:#fff; }
  #dtmf { display:grid; grid-template-columns:repeat(3,58px); gap:10px; margin-top:6px; }
  #dtmf[hidden] { display:none; }
  #dtmf button { height:52px; border-radius:14px; background:rgba(255,255,255,.1); font-size:20px; }
  .linhaAcoes { display:flex; gap:40px; margin-top:12px; }
  dialog { background:var(--cartao); color:var(--texto); border:1px solid var(--linha); border-radius:18px; padding:20px; width:320px; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog input { width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--linha); background:var(--fundo); color:var(--texto); font-size:16px; margin:10px 0 14px; }
  dialog .fim { display:flex; justify-content:flex-end; gap:10px; }
  dialog .fim button { padding:9px 16px; border-radius:10px; } dialog .fim .principal { background:var(--azul); color:#fff; }
</style>
</head>
<body>
<header>
  <div class="topo">
    <img src="../recursos/icone.png" alt="">
    <h1 id="titulo">IssaLink</h1>
    <button class="ligeiro" id="sair" title="Terminar sessão">Sair</button>
  </div>
  <div class="pilula" id="estado"><i></i><span>A ligar…</span></div>
</header>

<main>
  <section class="teclado">
    <input id="numero" placeholder="Número ou extensão" autocomplete="off" spellcheck="false" autofocus>
    <div class="grelha" id="grelha"></div>
    <div class="acoes">
      <span style="width:48px"></span>
      <button class="redondo verde" id="ligar" title="Ligar (Enter)">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      </button>
      <button id="apagar" title="Apagar">⌫</button>
    </div>
  </section>
  <aside>
    <h2>Recentes</h2>
    <div id="recentes"></div>
  </aside>
</main>

<div id="chamada" hidden>
  <div class="avatar" id="cAvatar">?</div>
  <h2 id="cNome"></h2>
  <div class="num" id="cNumero"></div>
  <div id="estadoChamada"></div>

  <!-- Chamada recebida -->
  <div class="linhaAcoes" id="aTocar" hidden>
    <button class="redondo vermelho" id="recusar" title="Recusar">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.1.3-4.6.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3s-.5-.1-.7-.3L.3 13.1A1 1 0 0 1 0 12.4c0-.3.1-.5.3-.7A17 17 0 0 1 12 7c4.5 0 8.6 1.7 11.7 4.7.2.2.3.4.3.7s-.1.5-.3.7l-2.5 2.4c-.2.2-.4.3-.7.3s-.5-.1-.7-.3a11 11 0 0 0-2.7-1.8.9.9 0 0 1-.6-.9V9.7C15.1 9.3 13.6 9 12 9z"/></svg>
    </button>
    <button class="redondo verde" id="atender" title="Atender">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
    </button>
  </div>

  <!-- Chamada em curso -->
  <div id="emCurso" hidden>
    <div class="botoes">
      <button class="opcao" id="silenciar"><span class="redondo"><svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .7-.2 1.4-.4 2.1l1.2 1.2c.6-1 .9-2.1.9-3.3zm-4 .2V5a3 3 0 0 0-6 0v.2l6 6zM4.3 3 3 4.3l6 6V11a3 3 0 0 0 4.3 2.7l1.6 1.6c-.9.4-1.9.7-2.9.7-2.8 0-5.3-2.1-5.3-5H5c0 3.4 2.7 6.2 6 6.7V21h2v-3.3c1-.1 1.9-.5 2.7-1L19.7 21 21 19.7 4.3 3z"/></svg></span>Silenciar</button>
      <button class="opcao" id="espera"><span class="redondo"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></span>Em espera</button>
      <button class="opcao" id="mostrarDtmf"><span class="redondo"><svg viewBox="0 0 24 24"><path d="M12 19a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6 1a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm12-8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-6 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></span>Teclado</button>
      <button class="opcao" id="transferir"><span class="redondo"><svg viewBox="0 0 24 24"><path d="M18 11l5-5-5-5v3h-4v4h4v3zm2 4.5c-1.3 0-2.5-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2a15 15 0 0 1-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1C8.7 6.5 8.5 5.3 8.5 4c0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1a17 17 0 0 0 17 17c.6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/></svg></span>Transferir</button>
    </div>
    <div id="dtmf" hidden></div>
  </div>

  <div class="linhaAcoes" id="soDesligar" hidden>
    <button class="redondo vermelho" id="desligar" title="Desligar">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.1.3-4.6.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3s-.5-.1-.7-.3L.3 13.1A1 1 0 0 1 0 12.4c0-.3.1-.5.3-.7A17 17 0 0 1 12 7c4.5 0 8.6 1.7 11.7 4.7.2.2.3.4.3.7s-.1.5-.3.7l-2.5 2.4c-.2.2-.4.3-.7.3s-.5-.1-.7-.3a11 11 0 0 0-2.7-1.8.9.9 0 0 1-.6-.9V9.7C15.1 9.3 13.6 9 12 9z"/></svg>
    </button>
  </div>
</div>

<dialog id="dlgTransferir">
  <b>Transferir chamada</b>
  <input id="destinoTransf" placeholder="Extensão de destino">
  <div class="fim"><button id="cancTransf">Cancelar</button><button class="principal" id="okTransf">Transferir</button></div>
</dialog>

<script src="telefone.js"></script>
</body>
</html>
