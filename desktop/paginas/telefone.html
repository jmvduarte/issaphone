<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'">
<title>Telefone</title>
<style>
  /* Telefone do modo "só chamadas" na app de computador: janela sem moldura com a forma
     de um telemóvel (cores do IssaFone/IssaLink). A janela é transparente à volta. */
  :root { --azul:#2F5BFF; --ciano:#14C8B4; --verde:#22c55e; --vermelho:#ef4444; --texto:#e6edf3; --suave:#93a4bf;
          --lcd:#7fe9ff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:transparent; overflow:hidden; }
  body { display:grid; place-items:center; color:var(--texto); font:14px/1.35 system-ui, "Segoe UI", Ubuntu, sans-serif; user-select:none; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  [hidden] { display:none !important; }

  /* Corpo do telemóvel */
  .telemovel { position:relative; width:300px; height:624px; border-radius:46px; padding:12px 14px 14px;
               background:linear-gradient(160deg,#4a5260 0%,#1d222b 22%,#0e1117 70%,#2a303a 100%);
               box-shadow:0 0 0 1.5px #5d6675, inset 0 0 0 2px #0a0c10, inset 0 2px 1px rgba(255,255,255,.25),
                          0 10px 28px rgba(0,0,0,.55); display:flex; flex-direction:column; }
  /* Botões laterais (decoração) */
  .lado { position:absolute; width:4px; border-radius:3px; background:linear-gradient(90deg,#69717f,#2b3039); }
  .lado.e1 { left:-4px; top:120px; height:40px; } .lado.e2 { left:-4px; top:170px; height:40px; }
  .lado.d1 { right:-4px; top:140px; height:62px; }

  /* Barra de cima: arrastar a janela, minimizar e fechar */
  .barra { -webkit-app-region:drag; height:30px; display:flex; align-items:center; gap:8px; padding:0 10px 0 16px; }
  .barra .altifalante { width:46px; height:5px; border-radius:3px; background:#05070a; box-shadow:inset 0 1px 2px #000, 0 1px 0 rgba(255,255,255,.12); margin:0 auto; }
  .barra h1 { position:absolute; left:28px; top:13px; margin:0; font-size:12px; font-weight:700; letter-spacing:.5px;
              background:linear-gradient(90deg,#8fb0ff,var(--ciano)); -webkit-background-clip:text; color:transparent; }
  .barra .janela { -webkit-app-region:no-drag; position:absolute; right:26px; top:9px; display:flex; gap:5px; }
  .barra .janela button { width:20px; height:20px; border-radius:6px; background:#232833; color:#c8d2e2; font-size:13px; line-height:20px;
                          box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }
  .barra .janela button:hover { background:#323947; } .barra .janela #fechar:hover { background:var(--vermelho); color:#fff; }

  /* Zona que muda: ecrã + teclado, ou o ecrã da chamada, ou os recentes */
  .area { position:relative; flex:1; display:flex; flex-direction:column; min-height:0; }

  /* Ecrã LCD */
  .ecra { position:relative; margin-top:4px; height:186px; border-radius:16px; padding:9px 12px; overflow:hidden;
          background:radial-gradient(120% 90% at 50% 0%,#14306a 0%,#0a1630 45%,#050a14 100%);
          box-shadow:inset 0 0 0 1px rgba(127,233,255,.16), inset 0 6px 18px rgba(0,0,0,.6); }
  .ecra::after { content:""; position:absolute; inset:0; pointer-events:none;
                  background:linear-gradient(155deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 38%); }
  .lcdTopo { display:flex; justify-content:space-between; font-size:12px; color:var(--lcd); font-variant-numeric:tabular-nums; opacity:.95; }
  .marca { display:flex; align-items:center; justify-content:center; gap:9px; margin:10px 0 8px; }
  .marca img { width:38px; height:38px; border-radius:11px; box-shadow:0 0 14px rgba(20,200,180,.35); }
  .marca span { font-size:25px; font-weight:800; letter-spacing:.5px;
                background:linear-gradient(90deg,#6f93ff,var(--ciano)); -webkit-background-clip:text; color:transparent; }
  .pilula { display:flex; align-items:center; gap:6px; font-size:11.5px; color:#cfe9ff; }
  .pilula i { width:8px; height:8px; border-radius:50%; background:#facc15; flex:none; box-shadow:0 0 6px currentColor; color:#facc15; }
  .pilula.ok i { background:var(--verde); color:var(--verde); } .pilula.erro i { background:var(--vermelho); color:var(--vermelho); }
  .pilula span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #numero { width:100%; margin-top:8px; text-align:right; font-size:26px; letter-spacing:1px; background:none; border:0;
            border-top:1px dashed rgba(127,233,255,.22); color:#fff; padding:6px 2px 0; outline:none; user-select:text;
            font-variant-numeric:tabular-nums; text-shadow:0 0 10px rgba(127,233,255,.35); }
  #numero::placeholder { color:rgba(207,233,255,.35); font-size:15px; letter-spacing:0; }

  /* Teclado */
  .grelha { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:12px; }
  .tecla { height:46px; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center;
           font-size:21px; font-weight:600; color:#f3f6fb;
           background:linear-gradient(180deg,#2c323d 0%,#1a1e26 52%,#13161c 100%);
           box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(0,0,0,.6); transition:filter .1s, transform .05s; }
  .tecla small { font-size:8.5px; letter-spacing:1.5px; color:#8fb0ff; height:10px; line-height:10px; font-weight:600; }
  .tecla:hover { filter:brightness(1.25); } .tecla:active { transform:translateY(1px); filter:brightness(.9); }
  .tecla.destaque { background:linear-gradient(180deg,#3f6bff 0%,#2449d6 55%,#1b39ad 100%); }
  .tecla.destaque small { color:#cfe0ff; }

  /* Linha de ações: recentes · ligar · apagar */
  .acoes { display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:7px; margin-top:7px; }
  .acoes button { height:46px; border-radius:11px; font-size:13px; font-weight:600; color:#dbe4f3;
                  background:linear-gradient(180deg,#2c323d,#13161c); box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(0,0,0,.6); }
  .acoes button:hover { filter:brightness(1.25); }
  .acoes #ligar { background:linear-gradient(180deg,#34d571 0%,#18a34a 60%,#128a3d 100%); display:flex; align-items:center; justify-content:center; }
  .acoes #ligar svg { width:24px; height:24px; fill:#fff; }

  /* Barra de baixo + botão "home" */
  .rodape { display:flex; justify-content:space-around; align-items:center; margin-top:10px; padding:0 4px; }
  .rodape button { width:38px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#9fb0c9; }
  .rodape button:hover { background:#1d222b; color:#fff; }
  .rodape svg { width:20px; height:20px; fill:currentColor; }
  .home { width:46px !important; height:46px !important; border-radius:50% !important; margin:0 6px;
          background:radial-gradient(circle at 50% 35%,#2a303a,#0b0d12) !important; box-shadow:0 0 0 2px #3c4350, inset 0 1px 0 rgba(255,255,255,.15); }
  .home i { width:16px; height:16px; border-radius:5px; border:2px solid #7d8899; }

  /* Recentes (cobre o ecrã e o teclado) */
  #vistaRecentes { position:absolute; inset:4px 0 0; border-radius:16px; background:linear-gradient(180deg,#0b1630,#060a14);
                   box-shadow:inset 0 0 0 1px rgba(127,233,255,.16); display:flex; flex-direction:column; padding:10px; }
  #vistaRecentes header { display:flex; align-items:center; gap:8px; color:var(--lcd); font-weight:700; margin-bottom:6px; }
  #vistaRecentes header button { color:var(--lcd); font-size:18px; padding:0 6px; }
  #recentes { flex:1; overflow:auto; }
  .recente { display:flex; align-items:center; gap:9px; padding:7px 6px; border-radius:10px; cursor:pointer; }
  .recente:hover { background:rgba(127,233,255,.08); }
  .avatar { width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
            font-weight:700; color:#fff; font-size:13px; background:linear-gradient(135deg,var(--azul),var(--ciano)); }
  .recente .info { flex:1; min-width:0; } .recente .info b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .recente .info span { color:var(--suave); font-size:11px; }
  .seta { font-size:12px; } .perdida { color:var(--vermelho); }
  .vazio { color:var(--suave); text-align:center; margin-top:40px; }

  /* Ecrã da chamada (cobre o ecrã e o teclado) */
  #chamada { position:absolute; inset:4px 0 0; border-radius:16px; overflow:hidden;
             background:radial-gradient(120% 70% at 50% 0%,#1d3a8a 0%,#0a1630 50%,#050a14 100%);
             box-shadow:inset 0 0 0 1px rgba(127,233,255,.16);
             display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:12px; }
  #chamada .avatar { width:84px; height:84px; font-size:30px; margin-bottom:6px; box-shadow:0 0 0 6px rgba(127,233,255,.08), 0 0 30px rgba(20,200,180,.3); }
  #chamada h2 { margin:0; font-size:22px; text-align:center; } #chamada .num { color:var(--suave); }
  #estadoChamada { color:var(--lcd); min-height:1.4em; font-variant-numeric:tabular-nums; }
  .redondo { width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .redondo svg { width:28px; height:28px; fill:#fff; }
  .verde { background:linear-gradient(180deg,#34d571,#128a3d); } .vermelho { background:linear-gradient(180deg,#f87171,#c81e1e); }
  .botoes { display:grid; grid-template-columns:repeat(4,56px); gap:8px; margin:18px 0 6px; }
  .opcao { display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:#cbd5e1; }
  .opcao .redondo { width:48px; height:48px; background:rgba(255,255,255,.1); }
  .opcao.ativo .redondo { background:#fff; } .opcao.ativo svg { fill:#0d1117; }
  .opcao svg { width:22px; height:22px; fill:#fff; }
  #dtmf { display:grid; grid-template-columns:repeat(3,54px); gap:7px; margin-top:4px; }
  #dtmf button { height:36px; border-radius:10px; background:rgba(255,255,255,.1); font-size:17px; }
  .linhaAcoes { display:flex; gap:44px; margin-top:16px; }

  dialog { background:#161b22; color:var(--texto); border:1px solid #30363d; border-radius:16px; padding:16px; width:250px; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog input { width:100%; padding:10px; border-radius:10px; border:1px solid #30363d; background:#0d1117; color:var(--texto); font-size:15px; margin:10px 0 12px; }
  dialog .fim { display:flex; justify-content:flex-end; gap:8px; }
  dialog .fim button { padding:8px 14px; border-radius:9px; } dialog .fim .principal { background:var(--azul); color:#fff; }
</style>
</head>
<body>
<div class="telemovel">
  <span class="lado e1"></span><span class="lado e2"></span><span class="lado d1"></span>

  <div class="barra">
    <h1 id="titulo">IssaLink</h1>
    <span class="altifalante"></span>
    <div class="janela">
      <button id="minimizar" title="Minimizar">–</button>
      <button id="fechar" title="Fechar (continua na bandeja a receber chamadas)">×</button>
    </div>
  </div>

  <div class="area">
    <div class="ecra">
      <div class="lcdTopo"><span id="hora">--:--</span><span id="ext"></span></div>
      <div class="marca"><img src="../recursos/icone.png" alt=""><span id="marcaNome">IssaLink</span></div>
      <div class="pilula" id="estado"><i></i><span>A ligar…</span></div>
      <input id="numero" placeholder="Número ou extensão" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <div class="grelha" id="grelha"></div>
    <div class="acoes">
      <button id="abrirRecentes" title="Chamadas recentes">Recentes</button>
      <button id="ligar" title="Ligar (Enter)"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></button>
      <button id="apagar" title="Apagar (Backspace)">⌫</button>
    </div>

    <div id="vistaRecentes" hidden>
      <header><button id="fecharRecentes" title="Voltar">‹</button>Recentes</header>
      <div id="recentes"></div>
    </div>

    <div id="chamada" hidden>
  <div class="avatar" id="cAvatar">?</div>
  <h2 id="cNome"></h2>
  <div class="num" id="cNumero"></div>
  <div id="estadoChamada"></div>

  <!-- Chamada recebida -->
  <div class="linhaAcoes" id="aTocar" hidden>
    <button class="redondo vermelho" id="recusar" title="Recusar">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.1.3-4.6.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3s-.5-.1-.7-.3L.3 13.1A1 1 0 0 1 0 12.4c0-.3.1-.5.3-.7A17 17 0 0 1 12 7c4.5 0 8.6 1.7 11.7 4.7.2.2.3.4.3.7s-.1.5-.3.7l-2.5 2.4c-.2.2-.4.3-.7.3s-.5-.1-.7-.3a11 11 0 0 0-2.7-1.8.9.9 0 0 1-.6-.9V9.7C15.1 9.3 13.6 9 12 9z"/></svg>
    </button>
    <button class="redondo verde" id="atender" title="Atender">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
    </button>
  </div>

  <!-- Chamada em curso -->
  <div id="emCurso" hidden>
    <div class="botoes">
      <button class="opcao" id="silenciar"><span class="redondo"><svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .7-.2 1.4-.4 2.1l1.2 1.2c.6-1 .9-2.1.9-3.3zm-4 .2V5a3 3 0 0 0-6 0v.2l6 6zM4.3 3 3 4.3l6 6V11a3 3 0 0 0 4.3 2.7l1.6 1.6c-.9.4-1.9.7-2.9.7-2.8 0-5.3-2.1-5.3-5H5c0 3.4 2.7 6.2 6 6.7V21h2v-3.3c1-.1 1.9-.5 2.7-1L19.7 21 21 19.7 4.3 3z"/></svg></span>Silenciar</button>
      <button class="opcao" id="espera"><span class="redondo"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></span>Em espera</button>
      <button class="opcao" id="mostrarDtmf"><span class="redondo"><svg viewBox="0 0 24 24"><path d="M12 19a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6 1a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm12-8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-6 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></span>Teclado</button>
      <button class="opcao" id="transferir"><span class="redondo"><svg viewBox="0 0 24 24"><path d="M18 11l5-5-5-5v3h-4v4h4v3zm2 4.5c-1.3 0-2.5-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2a15 15 0 0 1-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1C8.7 6.5 8.5 5.3 8.5 4c0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1a17 17 0 0 0 17 17c.6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/></svg></span>Transferir</button>
    </div>
    <div id="dtmf" hidden></div>
  </div>

  <div class="linhaAcoes" id="soDesligar" hidden>
    <button class="redondo vermelho" id="desligar" title="Desligar">
      <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.1.3-4.6.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3s-.5-.1-.7-.3L.3 13.1A1 1 0 0 1 0 12.4c0-.3.1-.5.3-.7A17 17 0 0 1 12 7c4.5 0 8.6 1.7 11.7 4.7.2.2.3.4.3.7s-.1.5-.3.7l-2.5 2.4c-.2.2-.4.3-.7.3s-.5-.1-.7-.3a11 11 0 0 0-2.7-1.8.9.9 0 0 1-.6-.9V9.7C15.1 9.3 13.6 9 12 9z"/></svg>
    </button>
  </div>
</div>
  </div>

  <div class="rodape">
    <button id="rodRecentes" title="Chamadas recentes"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L9 12H6a7 7 0 1 1 2.1 5l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8H12z"/></svg></button>
    <button id="rodTeclado" title="Teclado"><svg viewBox="0 0 24 24"><path d="M12 19a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6 1a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm12-8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-6 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
    <button class="home" id="home" title="Início"><i></i></button>
    <button id="registo" title="Ver registo do motor SIP"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></button>
    <button id="sair" title="Terminar sessão"><svg viewBox="0 0 24 24"><path d="M10 17l1.4 1.4L17.8 12l-6.4-6.4L10 7l4 4H3v2h11l-4 4zM19 3h-8v2h8v14h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg></button>
  </div>
</div>

<dialog id="dlgTransferir">
  <b>Transferir chamada</b>
  <input id="destinoTransf" placeholder="Extensão de destino">
  <div class="fim"><button id="cancTransf">Cancelar</button><button class="principal" id="okTransf">Transferir</button></div>
</dialog>

<script src="telefone.js"></script>
</body>
</html>
